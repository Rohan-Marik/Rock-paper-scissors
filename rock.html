<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1 >ROCK PAPER SCISSORS</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="535-5354119_paper-clipart-scissors-rock-paper-scissors-jpg-hd.png"/>

        </div>
         <div class="choice" id="paper">
            <img src="535-5351099_rock-paper-scissors-rock-paper-scissors-icons-png.png"/>
         </div>
         <div class="choice" id="scissor">
            <img src="535-5357819_rock-paper-scissors-png-transparent-png.png"/>
         </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user_score">0</p>
            <p>YOU</p>
        </div>
         <div class="score">
            <p id="comp_score">0</p>
            <p>COMPUTER</p>
        </div>
    </div>
    <div class="msg-container">
         <p id="msg">PLAY YOUR MOVE</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
